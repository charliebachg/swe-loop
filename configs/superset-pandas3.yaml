# The seam. Everything specific to this repository and this migration lives here.
# The pipeline reads this file and nothing else about the target.
name: superset-pandas3
repo: charliebachg/superset
upstream: apache/superset
base_branch: master                       # where the breakage was measured; the bot's branch is 762 commits stale (see the first triage verdict)
default_branch: master
language: python

trigger:
  source: github
  event: pull_request
  actions: [opened, synchronize, reopened]
  match:
    author: dependabot[bot]
    head_ref_prefix: dependabot/pip/
  issue_label: swe-loop            # tickets on the fork carrying this label enter the store
  exclude_labels: [tracking, epic]  # an issue that describes other issues is never given a session

detector:
  kind: pytest-warnings
  python: .venv-p2/bin/python
  env: {PYTHONHASHSEED: "0", SUPERSET_SECRET_KEY: not-a-secret}
  args: [-c, pytest.ini, -p, no:cacheprovider, -q, --tb=long, -o, addopts=, -W, "error::FutureWarning"]
  scope: [tests/common, tests/unit_tests]

acceptance:
  # {tests} is filled per ticket with the impacted test paths
  command: ".venv-p3/bin/python -m pytest -c pytest.ini -p no:cacheprovider -q -o addopts= -W error::FutureWarning {tests}"

router:
  max_files_per_shard: 3
  max_call_sites_per_shard: 6
  forbidden_paths: [tests/, .github/, superset/migrations/, requirements/]
  coverage_100_paths: [superset/sql/, superset/semantic_layers/]
  human_only_classes: [chained-assignment]      # upstream: needs context-dependent review
  test_only_rows_to: human                      # sessions never edit tests

session:
  max_acu_limit: 6
  playbook: playbooks/repair-pandas3.md
  tags_prefix: swe-loop
  pr_title_prefix: "fix(pandas)"
  version_range: ">=2.3.3, <3.1"                # the lower bound does not move

gate:
  repo_root: ../superset-fork              # the local clone whose .venv-p2 / .venv-p3 run the acceptance commands
  evidence_dir: data/live/evidence
  timeout_s: 1800

triage:
  # what the triage session reads besides the ticket: the measured inventory, published with this repository
  inventory_url: https://raw.githubusercontent.com/charliebachg/swe-loop/main/data/inventory/2026-09-03/inventory.json

scan:
  # A session reads the repository and files what it finds as tickets. It changes nothing.
  # The scan is given an area to search, never the defects to search for. Naming the classes
  # turns the session into a grep for an answer we already had, and a finder that can only
  # rediscover our own inventory is not finding anything. Devin's own code scans take a
  # scan_type from a fixed list of areas for the same reason.
  area: migration
  area_says: >-
    behaviour that changes when this repository moves between the two library versions named
    below. What that looks like in this code is the session's to work out
  max_findings: 5
  # Devin ships its own scanner. It takes an area from a fixed list and never a defect:
  # security, performance, db-queries, test-coverage, dead-code, code-quality, telemetry,
  # accessibility, general, migration-docs. Only security runs without a profile.
  devin_area: security
  # Files another piece of work already owns. A scan may read them, but it may not file against
  # them: two open changes to one file collide at the merge, and these carry work already in
  # flight. The loop refuses such a finding rather than trusting the session to remember.
  reserved_paths:
    - superset/charts/client_processing.py
    - superset/models/helpers.py
    - superset/utils/pandas_postprocessing/pivot.py
    - superset/utils/pandas_postprocessing/rolling.py
    - superset/utils/pandas_postprocessing/utils.py
    - superset/utils/pandas_postprocessing/aggregate.py
    - superset/utils/pandas_postprocessing/histogram.py
    - superset/utils/pandas_postprocessing/resample.py
  playbook: playbooks/scan-pandas3.md

review:
  # After the gate passes a PR, Devin Review is requested. One run waits this long for it to finish
  # and reads the result back, so the ticket reaches "ready for you" in the same run.
  wait_s: 900
  # auto: the review's remarks go back to the session that opened the PR, and the revised PR is
  # gated and reviewed again, once. manual: a person runs `review-followup` when they choose.
  followup: auto
  max_rounds: 1

rerun:
  # Reset a shard for a live rerun: its files go back to this commit (the base branch before any fix
  # landed), the old repair branch is deleted, and the store forgets the ticket. The issue stays open.
  baseline: 452817f2a1
  branch_prefix: swe-loop/
