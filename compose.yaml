services:
  swe-loop:
    build: .
    ports:
      # loopback only: the dashboard has no sign-in, and its buttons merge to GitHub with
      # whatever token is loaded. Change to "8000:8000" only on a network you trust.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SWE_LOOP_MODE: ${SWE_LOOP_MODE:-replay}
    volumes:
      - ./data:/app/data
      # live mode only: the checks clone the pull request here and run the acceptance commands
      # through this clone's interpreters, which must be built for Linux inside the container
      - ${SWE_LOOP_FORK:-../superset-fork}:/superset-fork
