<b>Tickets</b>
<table>
  <tr><th>ticket</th><th>class</th><th>route</th><th>status</th></tr>
  {% for t in board %}<tr>
    <td class="mono">{{ t.id }}{% if t.external_ref %} <span style="color:var(--muted)">#{{ t.external_ref.rsplit('#', 1)[-1] }}</span>{% endif %}</td>
    <td class="mono" style="font-size:11px">{{ (t.class or "")[:40] }}</td>
    <td>{{ t.router_decision or "" }}</td>
    <td class="st-{{ t.status }}">{{ t.status }}</td></tr>
  {% else %}<tr><td colspan="4">no tickets</td></tr>{% endfor %}
</table>
